name: actual-fork

services:
  actual:
    image: ${ACTUAL_IMAGE:-docker.io/actualbudget/actual-server:latest}
    restart: unless-stopped
    volumes:
      - ./actual-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACTUAL_HOSTNAME: ${ACTUAL_HOSTNAME}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      actual:
        condition: service_started
